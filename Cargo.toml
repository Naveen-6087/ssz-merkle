[package]
name = "ssz-merkle"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
description = "SSZ serialization, Merkleization, generalized indices and Merkle proofs (single, multi and light-client) for Ethereum consensus types, with no_std support"
license = "MIT"
repository = "https://github.com/Naveen-6087/ssz-merkle"
documentation = "https://docs.rs/ssz-merkle"
readme = "README.md"
keywords = ["ethereum", "ssz", "merkle-proof", "consensus", "no-std"]
categories = ["cryptography::cryptocurrencies", "encoding", "no-std"]
include = ["/src", "/examples", "/benches", "/README.md", "/CHANGELOG.md", "/LICENSE"]

[features]
default = []
cli = ["dep:snap"]
serde = ["dep:serde"]

[dependencies]
serde = { version = "1.0", default-features = false, features = ["alloc", "derive"], optional = true }
sha2 = { version = "0.10", default-features = false }
snap = { version = "1.1", optional = true }

[[bin]]
name = "ssz-merkle"
required-features = ["cli"]

[dev-dependencies]
criterion = { version = "0.5", default-features = false, features = ["cargo_bench_support"] }
proptest = "1.5"
serde_json = "1.0"
snap = "1.1"
yaml-rust2 = "0.10"

[[bench]]
name = "merkle"
harness = false

[profile.test]
opt-level = 2

[package.metadata.docs.rs]
all-features = true
